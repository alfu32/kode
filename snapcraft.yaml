name: kode
title: kode
base: core24
adopt-info: kode
license: MIT
summary: TUI code editor
description: |
  Kode is a terminal-first code editor packaged from the repository's
  Gradle distBundle task. The snap ships the unzipped distribution bundle
  plus a bundled JRE 21.
contact: https://github.com/alfu32/kode/issues
website:
  - https://github.com/alfu32/kode
source-code:
  - https://github.com/alfu32/kode
issues:
  - https://github.com/alfu32/kode/issues
icon: icon.svg

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  kode:
    command: bin/kode
    plugs:
      - home
      - removable-media
      - network
      - network-bind

parts:
  kode:
    plugin: nil
    source: .
    build-packages:
      - git
      - openjdk-21-jdk-headless
    stage-packages:
      - libx11-6
      - libxext6
      - libxi6
      - libxrender1
      - libxtst6
      - libjpeg-turbo8
      - liblcms2-2
      - libgif7
      - libharfbuzz0b
      - libasound2t64
    build-snaps:
      - gradle/latest/stable
    override-build: |
      set -eux

      export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
      export GRADLE_USER_HOME="$CRAFT_PART_BUILD/.gradle"
      export PATH="$JAVA_HOME/bin:/snap/bin:$PATH"

      VERSION="${V:-${KODE_VERSION:-}}"
      if [ -z "$VERSION" ]; then
        VERSION="$(git describe --tags --abbrev=0)"
      fi

      gradle --no-daemon distBundle -PdownloadTtydLibraries=false -PreleaseNumber="$VERSION"

      MODULES="$("$JAVA_HOME/bin/jdeps" \
        --ignore-missing-deps \
        --multi-release 21 \
        --print-module-deps \
        dist/kode.jar),jdk.crypto.ec"

      install -d "$CRAFT_PART_INSTALL/opt/kode"
      "$JAVA_HOME/bin/jlink" \
        --add-modules "$MODULES" \
        --strip-debug \
        --no-header-files \
        --no-man-pages \
        --compress=2 \
        --output "$CRAFT_PART_INSTALL/opt/kode/runtime"

      cp -a dist/. "$CRAFT_PART_INSTALL/opt/kode/"

      case "$(dpkg --print-architecture)" in
        amd64) JNA_PLATFORM="linux-x86-64" ;;
        arm64) JNA_PLATFORM="linux-aarch64" ;;
        *) JNA_PLATFORM="" ;;
      esac
      if [ -n "$JNA_PLATFORM" ]; then
        JNA_RESOURCE="com/sun/jna/$JNA_PLATFORM/libjnidispatch.so"
        JNA_EXTRACT_DIR="$CRAFT_PART_BUILD/.jna-extract"
        rm -rf "$JNA_EXTRACT_DIR"
        mkdir -p "$JNA_EXTRACT_DIR" "$CRAFT_PART_INSTALL/opt/kode/jna"
        (
          cd "$JNA_EXTRACT_DIR"
          "$JAVA_HOME/bin/jar" xf "$CRAFT_PART_BUILD/dist/kode.jar" "$JNA_RESOURCE"
        )
        install -m 755 "$JNA_EXTRACT_DIR/$JNA_RESOURCE" "$CRAFT_PART_INSTALL/opt/kode/jna/libjnidispatch.so"
      fi

      rm -f "$CRAFT_PART_INSTALL/opt/kode/kode" \
            "$CRAFT_PART_INSTALL/opt/kode/kode.sh" \
            "$CRAFT_PART_INSTALL/opt/kode/kode.bat" \
            "$CRAFT_PART_INSTALL/opt/kode/kode.cmd" \
            "$CRAFT_PART_INSTALL/opt/kode/kode.ps1"

      install -d "$CRAFT_PART_INSTALL/bin"
      cat > "$CRAFT_PART_INSTALL/bin/kode" <<'EOF'
      #!/bin/sh
      export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$SNAP_USER_COMMON/.cache}"
      export KODE_TTYD_CACHE="$XDG_CACHE_HOME"
      JNA_TMPDIR="$SNAP_USER_COMMON/.jna-tmp"
      JAVA_TMPDIR="$SNAP_USER_COMMON/tmp"
      mkdir -p \
        "$SNAP_USER_COMMON/.tree-sitter/lib" \
        "$XDG_CACHE_HOME" \
        "$JNA_TMPDIR" \
        "$JAVA_TMPDIR"
      exec "$SNAP/opt/kode/runtime/bin/java" \
        -Dkode.home="$SNAP/opt/kode" \
        -Djava.io.tmpdir="$JAVA_TMPDIR" \
        -Djna.boot.library.path="$SNAP/opt/kode/jna" \
        -Djna.tmpdir="$JNA_TMPDIR" \
        -Dtree-sitter-lib="$SNAP_USER_COMMON/.tree-sitter/lib" \
        -jar "$SNAP/opt/kode/kode.jar" \
        "$@"
      EOF
      chmod 755 "$CRAFT_PART_INSTALL/bin/kode"

      craftctl set version="$VERSION"
