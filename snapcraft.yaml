name: kode
title: kode
base: core24
adopt-info: kode
license: MIT
summary: TUI code editor
description: |
  Kode is a terminal-first code editor packaged from the repository's
  Gradle distBundle task. The snap ships the unzipped distribution bundle
  plus a bundled JRE 21.
contact: https://github.com/alfu32/kode/issues
website:
  - https://github.com/alfu32/kode
source-code:
  - https://github.com/alfu32/kode
issues:
  - https://github.com/alfu32/kode/issues
icon: icon.svg

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  kode:
    command: bin/kode
    plugs:
      - home
      - removable-media
      - network
      - network-bind

parts:
  kode:
    plugin: nil
    source: .
    build-packages:
      - openjdk-21-jdk-headless
    stage-packages:
      - libx11-6
      - libxext6
      - libxi6
      - libxrender1
      - libxtst6
      - libjpeg-turbo8
      - liblcms2-2
      - libgif7
      - libharfbuzz0b
      - libasound2t64
    build-snaps:
      - gradle/latest/stable
    override-build: |
      set -eux

      export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
      export GRADLE_USER_HOME="$CRAFT_PART_BUILD/.gradle"
      export PATH="$JAVA_HOME/bin:/snap/bin:$PATH"

      gradle --no-daemon distBundle

      MODULES="$("$JAVA_HOME/bin/jdeps" \
        --ignore-missing-deps \
        --multi-release 21 \
        --print-module-deps \
        dist/kode.jar),jdk.crypto.ec"

      install -d "$CRAFT_PART_INSTALL/opt/kode"
      "$JAVA_HOME/bin/jlink" \
        --add-modules "$MODULES" \
        --strip-debug \
        --no-header-files \
        --no-man-pages \
        --compress=2 \
        --output "$CRAFT_PART_INSTALL/opt/kode/runtime"

      cp -a dist/. "$CRAFT_PART_INSTALL/opt/kode/"

      rm -f "$CRAFT_PART_INSTALL/opt/kode/kode" \
            "$CRAFT_PART_INSTALL/opt/kode/kode.sh" \
            "$CRAFT_PART_INSTALL/opt/kode/kode.bat" \
            "$CRAFT_PART_INSTALL/opt/kode/kode.cmd" \
            "$CRAFT_PART_INSTALL/opt/kode/kode.ps1"

      install -d "$CRAFT_PART_INSTALL/bin"
      cat > "$CRAFT_PART_INSTALL/bin/kode" <<'EOF'
      #!/bin/sh
      mkdir -p "$SNAP_USER_COMMON/.tree-sitter"
      exec "$SNAP/opt/kode/runtime/bin/java" \
        -Dkode.home="$SNAP/opt/kode" \
        -Dtree-sitter-lib="$SNAP_USER_COMMON/.tree-sitter/lib" \
        -jar "$SNAP/opt/kode/kode.jar" \
        "$@"
      EOF
      chmod 755 "$CRAFT_PART_INSTALL/bin/kode"

      craftctl set version="$(git describe --tags --abbrev=0 2>/dev/null || echo 3.3.4)"
